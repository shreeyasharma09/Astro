<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Astro — Social Anxiety Practice</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Nunito', 'system-ui', '-apple-system', 'sans-serif']
          },
          colors: {
            bg: { light: '#FBF8FF', dark: '#1A1826' },
            surface: { light: '#FFFFFF', dark: '#252236' },
            lilac: { DEFAULT: '#B5A5E8', strong: '#8E78D0', soft: '#E8E0FB', dark: '#C9BAF5' },
            sage: { DEFAULT: '#A8C9A8', strong: '#7FAE7F', soft: '#DFEDDF', dark: '#B8D9B8' },
            sky: { DEFAULT: '#A5C9E8', strong: '#6FA5D1', soft: '#DEEDFB', dark: '#B5D9F5' },
            coral: '#F2B5B5',
            crisis: '#E8655C',
            ink: { light: '#2D2A3E', dark: '#F0EEF8' },
            mute: { light: '#6B6880', dark: '#9C9AAD' }
          },
          borderRadius: {
            card: '16px',
            btn: '12px',
            modal: '20px'
          },
          boxShadow: {
            soft: '0 4px 16px rgba(45,42,62,0.08)',
            'soft-dark': '0 4px 16px rgba(0,0,0,0.3)'
          }
        }
      }
    };
  </script>

  <style>
    html, body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
      background: #EEE7F9;
    }
    .dark html, .dark body { background: #0E0D18; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .device-frame {
      width: 100%;
      max-width: 420px;
      height: 100dvh;
      max-height: 900px;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(45,42,62,0.18);
      position: relative;
    }
    @media (max-width: 430px) {
      .device-frame { border-radius: 0; max-height: 100dvh; box-shadow: none; }
    }
    .dark .device-frame { box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
    .fade-enter { animation: fade 220ms ease-out; }
    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pulse-slow { animation: pulseSoft 2.4s ease-in-out infinite; }
    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .typing-dot { animation: typing 1s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }
        /* Mic orb breathing rings (Speak mode) */
    .orb-ring-1 { animation: orbPulse 2.4s ease-in-out infinite; }
    .orb-ring-2 { animation: orbPulse 2.4s ease-in-out infinite 0.6s; }
    @keyframes orbPulse {
      0%, 100% { transform: scale(1); opacity: 0.45; }
      50% { transform: scale(1.12); opacity: 0.15; }
    }
    /* Waveform bars */
    .wave-bar { animation: waveBounce 0.9s ease-in-out infinite; transform-origin: center; }
    @keyframes waveBounce {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
    /* Caret for Type mode placeholder */
    .type-caret { animation: caretBlink 1s step-start infinite; }
    @keyframes caretBlink {
      50% { opacity: 0; }
    }
  </style>
  
  <!-- React + Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase client, attached to window.supabase for classic scripts to use -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config/supabase.js';

    if (SUPABASE_URL && !SUPABASE_URL.includes('YOUR_PROJECT')) {
      window.supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('[Astro] Supabase client ready');
    } else {
      console.warn('[Astro] Supabase not configured — running in guest-only mode. Add credentials in config/supabase.js.');
    }
    window.dispatchEvent(new Event('supabase-ready'));
  </script>
</head>

<body>
  <div id="root" class="min-h-dvh flex items-center justify-center p-0 sm:p-6"></div>

  <!-- Split source files (order matters — foundations → screens → services → app) -->
  <script type="text/babel" data-presets="react" src="src/01-foundations.js"></script>
  <script type="text/babel" data-presets="react" src="src/02-screens.js"></script>
  <script type="text/babel" data-presets="react" src="src/03-services.js"></script>
  <script type="text/babel" data-presets="react" src="src/04-app.js"></script>
</body>
</html>
